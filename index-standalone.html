const JurnalEmosi = ({ data, updateData }) => {
  const emosiList = ["Senang", "Tenang", "Biasa saja", "Sedih", "Marah", "Cemas", "Bingung", "Malu", "Kecewa", "Lelah"];
  const selectedEmosi = data.jurnalEmosi.selectedEmosi || [];

  const toggleEmosi = (e) => {
    if (selectedEmosi.includes(e)) {
      updateData('jurnalEmosi', 'selectedEmosi', selectedEmosi.filter(i => i !== e));
    } else {
      updateData('jurnalEmosi', 'selectedEmosi', [...selectedEmosi, e]);
    }
  };

  return (
    <div className="space-y-8 animate-fade-in print-content">
      <NeoBox bgColor="bg-[#FF90E8]">
        <h2 className="text-3xl font-black uppercase mb-2">🤝 Emotion Diary</h2>
        <p className="font-bold text-xl">Kenali emosi tanpa menghakimi diri sendiri.</p>
      </NeoBox>

      <NeoBox bgColor="bg-white">
        <h3 className="text-2xl font-black mb-4">A. Emosi apa yang kurasakan hari ini?</h3>
        <div className="flex flex-wrap gap-3">
          {emosiList.map(e => (
            <NeoPill 
              key={e} 
              label={e} 
              selected={selectedEmosi.includes(e)} 
              onClick={() => toggleEmosi(e)} 
              bgColor="bg-[#FF90E8]" 
            />
          ))}
        </div>
      </NeoBox>

      <div className="grid md:grid-cols-2 gap-8">
        <NeoBox bgColor="bg-[#FFE066]">
          <h3 className="text-xl font-black mb-2">B. Apa yang terjadi?</h3>
          <p className="font-bold mb-2 text-sm">Tuliskan situasi yang paling mempengaruhi emosimu.</p>
          <NeoTextArea 
            placeholder="Misal: Dimarahi orang tua karena pulang terlambat..." 
            rows={4} 
            value={data.jurnalEmosi.situasi}
            onChange={(e) => updateData('jurnalEmosi', 'situasi', e.target.value)}
          />

          <NeoTextArea 
            placeholder="Misal: Orang tua tidak menyayangiku, tidak peduli alasanku..." 
            rows={4} 
            value={data.jurnalEmosi.pikiran}
            onChange={(e) => updateData('jurnalEmosi', 'pikiran', e.target.value)}
          />
        </NeoBox>
      </div>

      <NeoBox bgColor="bg-white">
        <div className="flex items-center justify-between mb-4">

function NeoBrutalismApp({
  formData: propFormData,
  updateData: propUpdateData,
  activeTab: propActiveTab,
  setActiveTab: propSetActiveTab,
  onSelectStyle,
  currentStyle = 1,
  handleReset: propHandleReset
}) {
  const [localActiveTab, setLocalActiveTab] = useState('beranda');
  const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
  const [localFormData, setLocalFormData] = useState(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        return JSON.parse(saved);
      }
    } catch (err) {
      console.error("Gagal membaca dari localStorage", err);
    }
    return defaultData;
  });

  const formData = propFormData || localFormData;
  const activeTab = propActiveTab || localActiveTab;
  const setActiveTab = propSetActiveTab || setLocalActiveTab;

  const [printAll, setPrintAll] = useState(false);

  // Auto-save to localStorage only if managing own state
  useEffect(() => {
    if (!propFormData) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(formData));
      } catch (err) {
        console.error("Gagal menyimpan ke localStorage", err);
      }
    }
  }, [formData, propFormData]);

  const updateData = propUpdateData || ((section, field, value) => {
    setLocalFormData(prev => ({
      ...prev,
      [section]: {
        ...prev[section],
        [field]: value
      }
    }));
  });

  const handleReset = propHandleReset || (() => {
    if (window.confirm("Apakah kamu yakin ingin mengosongkan seluruh lembar kerja?")) {
      setLocalFormData(defaultData);
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (err) {}
    }
  });

  const tabs = [
    { id: 'beranda', label: 'Beranda', icon: <span className="text-xl">📖</span> },
    { id: 'bacaan', label: 'Materi Bacaan', icon: <span className="text-xl">📚</span> },
    { id: 'emosi', label: 'Jurnal Emosi', icon: <span className="text-xl">🤝</span> },
    { id: 'pikiran', label: 'Kelola Pikiran', icon: <span className="text-xl">🧠</span> },
    { id: 'kekuatan', label: 'Kekuatan Diri', icon: <span className="text-xl">✨</span> },
    { id: 'keseharian', label: 'Keseharian', icon: <span className="text-xl">📴</span> },
    { id: 'support', label: 'Support & Rencana', icon: <span className="text-xl">👥</span> },
  ];

  const renderContent = () => {
    switch (activeTab) {
      case 'beranda': return <Beranda data={formData} updateData={updateData} />;
      case 'bacaan': return <MateriBacaan />;
      case 'emosi': return <JurnalEmosi data={formData} updateData={updateData} />;
      case 'pikiran': return <KelolaPikiran data={formData} updateData={updateData} />;
      case 'kekuatan': return <KekuatanDiri data={formData} updateData={updateData} />;
      case 'keseharian': return <Keseharian data={formData} updateData={updateData} />;
      case 'support': return <Support data={formData} updateData={updateData} />;
      default: return <Beranda data={formData} updateData={updateData} />;
    }
  };

  // Fungsi untuk Print / Save PDF
  const handlePrintCurrent = () => {
    setPrintAll(false);
    setTimeout(() => {
      window.print();
    }, 100);
  };

  const handlePrintFullWorkbook = () => {
    setPrintAll(true);
    setTimeout(() => {
      window.print();
      // Reset back after print dialog closes
      setTimeout(() => setPrintAll(false), 500);
    }, 150);
  };

  return (
    <div className="min-h-screen bg-[#FEF6E4] text-black font-sans selection:bg-[#FF90E8] flex flex-col md:flex-row print-layout">
      
      {/* Mobile Header - Hidden in Print */}
      <div className="md:hidden border-b-4 border-black bg-white p-4 flex justify-between items-center sticky top-0 z-50 no-print">
        <h1 className="font-black text-xl uppercase tracking-tighter">Buku Mental Remaja</h1>

function ScrapbookApp({
  formData: propFormData,
  updateData: propUpdateData,
  activeTab: propActiveTab,
  setActiveTab: propSetActiveTab,
  onSelectStyle,
  currentStyle = 2,
  handleReset: propHandleReset
}) {
  const [localActiveTab, setLocalActiveTab] = useState('beranda');
  const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
  const [localFormData, setLocalFormData] = useState(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        return JSON.parse(saved);
      }
    } catch (err) {
      console.error("Gagal membaca dari localStorage", err);
    }
    return defaultData;
  });

  const formData = propFormData || localFormData;
  const activeTab = propActiveTab || localActiveTab;
  const setActiveTab = propSetActiveTab || setLocalActiveTab;

  const [printAll, setPrintAll] = useState(false);

  // Simpan otomatis ke localStorage jika menggunakan local state
  useEffect(() => {
    if (!propFormData) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(formData));
      } catch (err) {
        console.error("Gagal menyimpan ke localStorage", err);
      }
    }
  }, [formData, propFormData]);

  const updateData = propUpdateData || ((section, field, value) => {
    setLocalFormData(prev => ({
      ...prev,
      [section]: {
        ...prev[section],
        [field]: value
      }
    }));
  });

  const handleReset = propHandleReset || (() => {
    if (window.confirm("Apakah kamu yakin ingin mengosongkan seluruh lembar catatan scrapbook ini?")) {
      setLocalFormData(defaultData);
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (err) {}
    }
  });

  const tabs = [
    { id: 'beranda', label: 'Cover & Profil', icon: '📖' },
    { id: 'bacaan', label: 'Kliping Materi', icon: '📚' },
    { id: 'emosi', label: 'Jurnal Rasa', icon: '🤝' },
    { id: 'pikiran', label: 'Urai Pikiran', icon: '🧠' },
    { id: 'kekuatan', label: 'Kekuatan Diri', icon: '✨' },
    { id: 'keseharian', label: 'Keseharian', icon: '📴' },
    { id: 'support', label: 'Lingkar Teman', icon: '👥' },
  ];

  const renderContent = () => {
    switch (activeTab) {
      case 'beranda': return <Beranda data={formData} updateData={updateData} />;
      case 'bacaan': return <MateriBacaan />;
      case 'emosi': return <JurnalEmosi data={formData} updateData={updateData} />;
      case 'pikiran': return <KelolaPikiran data={formData} updateData={updateData} />;
      case 'kekuatan': return <KekuatanDiri data={formData} updateData={updateData} />;
      case 'keseharian': return <Keseharian data={formData} updateData={updateData} />;
      case 'support': return <Support data={formData} updateData={updateData} />;
      default: return <Beranda data={formData} updateData={updateData} />;
    }
  };

  const handlePrintCurrent = () => {
    setPrintAll(false);
    setTimeout(() => {
      window.print();
    }, 100);
  };

  const handlePrintFullWorkbook = () => {
    setPrintAll(true);
    setTimeout(() => {
      window.print();
      setTimeout(() => setPrintAll(false), 500);
    }, 150);
  };

  return (
    <div className="min-h-screen bg-[#faf5ec] text-[#3d2f25] font-sans selection:bg-[#ffe5d9] flex flex-col md:flex-row print-layout">
      
      {/* Mobile Topbar */}

          <span className="text-2xl">📓</span>
          <span className="font-serifHand font-bold text-2xl text-[#4a3525]">Scrapbook Mental</span>
        </div>
        <button 
          onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} 
          className="border-2 border-[#d5c7b9] px-3 py-1 rounded-xl bg-[#faedcd] font-hand font-bold text-xl"
          aria-label="Menu"
        >
          {isMobileMenuOpen ? '✖ Tutup' : '☰ Lembar'}
        </button>
      </div>

      {/* Sidebar Scrapbook Navigation */}
      <nav className={`
        ${isMobileMenuOpen ? 'block' : 'hidden'} 
        md:flex flex-col w-full md:w-80 shrink-0 bg-[#fffdf9] border-r-2 border-dashed border-[#d5c7b9] p-6 md:sticky md:top-0 md:h-screen md:overflow-y-auto z-40
        absolute md:relative left-0 top-[65px] md:top-0 h-[calc(100vh-65px)] border-b-2 md:border-b-0 no-print shadow-sm
      `}>
        {/* Header Buku Jurnal */}
        <div className="hidden md:block mb-8 relative">
          <WashiTape color="bg-[#fbcfe8]/80" rotate="-rotate-3" className="absolute -top-3 left-4 w-24" />
          <div className="bg-[#faedcd] p-4 rounded-2xl border-2 border-dashed border-[#d4a373] shadow-xs text-center">
            <h1 className="text-3xl font-serifHand font-bold text-[#4a3525] leading-none">
              Scrapbook
            </h1>
            <p className="text-lg font-hand text-[#6b4e3d] mt-1">
              Buku Harian Kesehatan Mental
            </p>
          </div>
        </div>

        {/* Tab Links */}
        <ul className="space-y-2.5 flex-1">
          {tabs.map((tab) => {
            const isActive = activeTab === tab.id;
            return (
              <li key={tab.id}>
                <button
                  onClick={() => {
                    setActiveTab(tab.id);
                    setIsMobileMenuOpen(false);
                  }}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl font-hand font-bold text-lg text-left transition-all
                    ${isActive 
                      ? 'bg-[#ffe5d9] text-[#4a3525] border-2 border-[#d4a373] shadow-sm translate-x-1 rotate-1 scale-[1.02]' 
                      : 'bg-white/80 hover:bg-[#fff9ef] text-[#6b584a] border border-[#e8dfd5] hover:border-[#d5c7b9]'
                    }`}
                >
                  <span className="text-2xl">{tab.icon}</span>
                  <span>{tab.label}</span>

        <div className="mt-8 space-y-3">

          {/* Switcher 4 Desain di Sidebar */}

function MemphisApp({
  formData: propFormData,
  updateData: propUpdateData,
  activeTab: propActiveTab,
  setActiveTab: propSetActiveTab,
  onSelectStyle,
  currentStyle = 3,
  handleReset: propHandleReset
}) {
  const [localActiveTab, setLocalActiveTab] = useState('beranda');
  const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
  const [localFormData, setLocalFormData] = useState(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        return JSON.parse(saved);
      }
    } catch (err) {
      console.error("Gagal membaca dari localStorage", err);
    }
    return defaultData;
  });

  const formData = propFormData || localFormData;
  const activeTab = propActiveTab || localActiveTab;
  const setActiveTab = propSetActiveTab || setLocalActiveTab;

  const [printAll, setPrintAll] = useState(false);

  useEffect(() => {
    if (!propFormData) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(formData));
      } catch (err) {
        console.error("Gagal menyimpan ke localStorage", err);
      }
    }
  }, [formData, propFormData]);

  const updateData = propUpdateData || ((section, field, value) => {
    setLocalFormData(prev => ({
      ...prev,
      [section]: {
        ...prev[section],
        [field]: value
      }
    }));
  });

  const handleReset = propHandleReset || (() => {
    if (window.confirm("Apakah kamu yakin ingin mengosongkan seluruh formulir?")) {
      setLocalFormData(defaultData);
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (err) {}
    }
  });

    { id: 'beranda', label: 'Beranda', icon: '📖', color: 'bg-[#FFBE0B]' },

function RisographApp({
  formData: propFormData,
  updateData: propUpdateData,
  activeTab: propActiveTab,
  setActiveTab: propSetActiveTab,
  onSelectStyle,
  currentStyle = 4,
  handleReset: propHandleReset
}) {
  const [localActiveTab, setLocalActiveTab] = useState('beranda');
  const [localFormData, setLocalFormData] = useState(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        return { ...defaultData, ...parsed };
      }
    } catch (e) {
      console.error('Failed to parse saved data', e);
    }
    return defaultData;
  });

  const formData = propFormData || localFormData;
  const activeTab = propActiveTab || localActiveTab;
  const setActiveTab = propSetActiveTab || setLocalActiveTab;

  const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
  const [printAll, setPrintAll] = useState(false);

  useEffect(() => {
    if (!propFormData) {

        localStorage.setItem(STORAGE_KEY, JSON.stringify(formData));
      } catch (e) {
        console.error('Failed to save data', e);
      }
    }
  }, [formData, propFormData]);

  const updateData = propUpdateData || ((section, field, value) => {
    setLocalFormData((prev) => ({
      ...prev,
      [section]: {
        ...prev[section],
        [field]: value
      }
    }));
  });

  const handleReset = propHandleReset || (() => {
    if (window.confirm('Yakin ingin mereset seluruh isi catatan? Data tidak bisa dikembalikan.')) {

function parseStyleFromQuery() {
  if (typeof window === 'undefined') return 1;
  const params = new URLSearchParams(window.location.search);
  const s = params.get('style');
  if (s === '1' || s === 'neo' || s === 'neobrutalism') return 1;
  if (s === '2' || s === 'scrapbook' || s === 'journal') return 2;
  if (s === '3' || s === 'memphis' || s === 'pop') return 3;
  if (s === '4' || s === 'risograph' || s === 'zine') return 4;

  const path = window.location.pathname.toLowerCase();
  if (path.includes('scrapbook')) return 2;
  if (path.includes('memphis')) return 3;
  if (path.includes('risograph')) return 4;

  // Fallback to localStorage
  try {
    const savedStyle = localStorage.getItem(STYLE_KEY);
    if (savedStyle && ['1', '2', '3', '4'].includes(savedStyle)) {
      return parseInt(savedStyle, 10);
    }
  } catch (err) {}

  return 1;
}

function App() {
  const [currentStyle, setCurrentStyle] = useState(parseStyleFromQuery);
  const [activeTab, setActiveTab] = useState('beranda');

  // Shared formData across all styles
  const [formData, setFormData] = useState(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        return { ...defaultData, ...parsed };
      }
    } catch (err) {
      console.error("Gagal membaca dari localStorage", err);
    }
    return defaultData;
  });

  // Auto-save form data on every change
  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(formData));
    } catch (err) {
      console.error("Gagal menyimpan ke localStorage", err);
    }
  }, [formData]);

  // Listen to browser Back/Forward navigation
  useEffect(() => {
    const onPopState = () => {
      setCurrentStyle(parseStyleFromQuery());
    };
    window.addEventListener('popstate', onPopState);
    return () => window.removeEventListener('popstate', onPopState);
  }, []);

  const handleSelectStyle = useCallback((styleId) => {
    setCurrentStyle(styleId);
    try {
      localStorage.setItem(STYLE_KEY, styleId.toString());
    } catch (err) {}

    // Update URL query parameter smoothly without page reload
    const url = new URL(window.location.href);
    url.searchParams.set('style', styleId.toString());
    window.history.replaceState({}, '', url.toString());

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, []);

  const updateData = useCallback((section, field, value) => {
    setFormData((prev) => ({
      ...prev,
      [section]: {
        ...prev[section],
        [field]: value
      }
    }));
  }, []);

  const handleReset = useCallback(() => {
    if (window.confirm("Apakah kamu yakin ingin mengosongkan seluruh lembar kerja? Semua isian di seluruh style akan dihapus.")) {
      setFormData(defaultData);
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (err) {}
    }
  }, []);

  const commonProps = {
    formData,
    updateData,
    activeTab,
    setActiveTab,
    onSelectStyle: handleSelectStyle,
    currentStyle,
    handleReset
  };

  return (
    <div className="w-full min-h-screen flex flex-col">
      {/* Top Floating/Sticky Style Switcher Bar */}
      <StyleSwitcherBar 
        currentStyle={currentStyle} 
        onSelectStyle={handleSelectStyle} 
      />

      {/* Main Active Style Content */}
      <div className="flex-1 w-full">
        {currentStyle === 1 && <NeoBrutalismApp {...commonProps} />}
        {currentStyle === 2 && <ScrapbookApp {...commonProps} />}
        {currentStyle === 3 && <MemphisApp {...commonProps} />}
        {currentStyle === 4 && <RisographApp {...commonProps} />}
      </div>
    </div>
  );
}
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
